name: Chercher les offres

on:
  schedule:
    - cron: "0 */6 * * *"      # toutes les 6 heures
  workflow_dispatch:            # bouton "Run workflow" manuel
  push:
    paths:
      - companies.yaml
      - config.yaml
      - scrape.py

permissions:
  contents: write

# un seul passage à la fois : les suivants attendent leur tour au lieu de se marcher dessus
concurrency:
  group: chercher-les-offres
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 pyyaml playwright

      - name: Installer le navigateur (sites JavaScript)
        run: playwright install --with-deps chromium

      - name: Chercher les offres
        run: python scrape.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offers.json
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour des offres"
            # si le dépôt a changé pendant la recherche, on récupère d'abord les changements
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep 5
            done
            exit 1
          fi
