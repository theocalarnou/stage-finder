# Liste des entreprises à surveiller.
# Le site visite ces pages à intervalle régulier et en extrait les offres de stage.
#
# Types de sources :
#   generic    : page "carrières" classique (HTML). Le scraper cherche les liens d'offres
#                et les données structurées JSON-LD "JobPosting".
#   greenhouse : entreprise qui utilise Greenhouse. token = identifiant dans
#                https://boards.greenhouse.io/<token>
#   lever      : entreprise qui utilise Lever. token = identifiant dans
#                https://jobs.lever.co/<token>
#
# Options facultatives pour "generic" :
#   render: js            -> pour les sites dont les offres s'affichent en JavaScript (offres absentes
#                            quand on regarde le code de la page). Un peu plus lent.
#   fetch_details: true   -> ouvre chaque offre pour analyser sa description (meilleur score, plus lent)
#   link_selector: "css"  -> sélecteur CSS précis des liens d'offres si l'extraction automatique échoue
#
# IMPORTANT : vérifiez chaque URL dans votre navigateur avant de l'activer.
# Les sites changent souvent d'adresse. Ajoutez/supprimez des entreprises à votre guise.

companies:
  - name: RIVR (test)
    type: lever
    token: rivr

