# Liste des entreprises à surveiller.
# Le site visite ces pages à intervalle régulier et en extrait les offres de stage.
#
# Types de sources :
#   generic    : page "carrières" classique (HTML). Le scraper cherche les liens d'offres
#                et les données structurées JSON-LD "JobPosting".
#   greenhouse : entreprise qui utilise Greenhouse. token = identifiant dans
#                https://boards.greenhouse.io/<token>
#   workday    : entreprise qui utilise Workday (adresse en ...myworkdayjobs.com/...). Mettez l'adresse
#                de la page de recherche d'offres dans url. Le robot y cherche les mots de stage.
#   adzuna     : recherches sur l'agrégateur Adzuna (voir l'entrée en tête de liste)
#   lever      : entreprise qui utilise Lever. token = identifiant dans
#                https://jobs.lever.co/<token>
#
# Options facultatives pour "generic" :
#   render: js            -> pour les sites dont les offres s'affichent en JavaScript (offres absentes
#                            quand on regarde le code de la page). Un peu plus lent.
#   fetch_details: true   -> ouvre chaque offre pour analyser sa description (meilleur score, plus lent)
#   all_are_internships: true -> la page est déjà filtrée sur les stages : garder aussi les offres
#                            dont le titre ne contient pas le mot « stage »
#   link_pattern: "texte"   -> morceau d'adresse commun à tous les liens d'offres du site
#   link_selector: "css"  -> sélecteur CSS précis des liens d'offres si l'extraction automatique échoue
#
# IMPORTANT : vérifiez chaque URL dans votre navigateur avant de l'activer.
# Les sites changent souvent d'adresse. Ajoutez/supprimez des entreprises à votre guise.

companies:
  # ---- Agrégateur Adzuna (API officielle). Nécessite les clés dans les secrets GitHub, voir le guide.
  # searches : par pays (fr, gb, de, it, es, nl, at, ch...), la liste des recherches à faire.
  - name: Adzuna
    type: adzuna
    searches:
      fr:
        - stage mécatronique
        - stage ingénieur mécanique
        - stage conception mécanique
        - stage sport automobile
        - stage R&D automobile
        - stage bureau d'études
      gb:
        - mechanical engineering internship
        - mechatronics internship
        - motorsport placement
      de:
        - Praktikum Maschinenbau
        - Praktikum Mechatronik
        - Praktikum Motorsport
      it:
        - stage ingegneria meccanica
      es:
        - prácticas ingeniería mecánica

